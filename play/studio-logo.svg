<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="320" viewBox="0 0 1024 320">
  <defs>
    <radialGradient id="sun" cx="0.42" cy="0.38" r="0.62">
      <stop offset="0%" stop-color="#FFE873"/>
      <stop offset="100%" stop-color="#FFD93D"/>
    </radialGradient>
    <radialGradient id="halo" cx="170" cy="130" r="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE873" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FFD93D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFD93D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Mark: 260x260, centered vertically (viewBox h=320, mark y=30-290, midline=160) -->
  <g transform="translate(40 30) scale(2.6)">
    <!-- Halo: cx=50 cy=36 r=22  →  group-space (50,36)*2.6+(40,30) = (170,123.6); r=22*2.6=57.2.
         Halo gradient is in viewBox userSpace and applied here after the group transform. -->
    <circle cx="50" cy="36" r="22" fill="url(#halo)"/>
    <circle cx="50" cy="36" r="13" fill="url(#sun)"/>
    <path d="M 0 66 Q 25 38 100 60 L 100 100 L 0 100 Z" fill="#5BA85F"/>
    <path d="M 4 64.8 Q 25 36.8 96 59.2" fill="none" stroke="#A8DDB5" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 0 92 Q 72 54 100 78 L 100 100 L 0 100 Z" fill="#2D7A3E"/>
    <path d="M 5 90.5 Q 72 52.5 95 77" fill="none" stroke="#5BA85F" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  </g>
  <!-- Wordmark — nudged up so midline aligns with mark midline (y≈160).
       GREENFIELD cap-top ≈ 102 → cap-mid ≈ 132. STUDIO baseline 228, mid ≈ 217. Wordmark mid ≈ 160. -->
  <text x="340" y="160" font-family="Fredoka, 'Nunito', 'Quicksand', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="82" font-weight="700" letter-spacing="3" fill="#2D7A3E">GREENFIELD</text>
  <text x="340" y="228" font-family="Fredoka, 'Nunito', 'Quicksand', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="46" font-weight="500" letter-spacing="14" fill="#5BA85F">STUDIO</text>
</svg>
