    <script>
      // Show "Rotate" overlay on touch devices when portrait.
      // R2798 (mobile Tier 1.1) — now dismissible + portrait-aware:
      //   • "Continue anyway" remembers the choice for the session (mgp_dismissRotate)
      //     so an iOS user (no orientation.lock) is never trapped.
      //   • window.__mgPortraitOK is set by the app when Portrait Play (beta) is on,
      //     so the overlay never fights a deliberate portrait session.
      (function(){
        var isMob = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        if (!isMob) return;
        var el = document.getElementById('rotate-overlay');
        if (!el) return;
        // R3847 - the overlay may not appear until the APP has said it wants landscape.
        // It used to show whenever `__mgPortraitOK !== true`, and that flag is published by
        // React (minigolf.jsx ~7091) - so for the whole of a cold load it is `undefined` and a
        // portrait-held phone stared at a full-screen "Rotate Your Device" wall over the
        // loading splash. On slow-3G that is the entire ~24s time-to-playable window, on the
        // majority of a portal's traffic, in a build where `_portraitPlay` DEFAULTS TO TRUE
        // (state.js:1681, R2840) - so the instruction was not merely early, it was unnecessary.
        // Worse, tapping "Continue anyway" just to see the loading screen burned
        // `mgp_dismissRotate` for the whole session, spending the escape hatch on a prompt that
        // should never have been raised.
        // A local latch, NOT a seeded `__mgPortraitOK = true`: that flag is the app's channel
        // and writing a value into it here would be asserting something we do not know. If the
        // app never mounts, the overlay simply never shows - correct, because the crash screen
        // owns that surface. Every post-mount behaviour is byte-unchanged.
        var appSpoke = false;
        var dismissed = false;
        try { dismissed = sessionStorage.getItem('mgp_dismissRotate') === '1'; } catch (e) {}
        // R2827 — orientation source of truth. Inside the itch.io iframe on Android the
        // iframe viewport does NOT reflow when the device physically rotates, so
        // innerWidth/innerHeight stay stuck and the overlay never clears (user trapped on
        // first launch). Prefer the DEVICE orientation (screen.orientation.type, then the
        // legacy window.orientation), which DO update inside iframes; fall back to the
        // dimension compare only when neither API exists (old desktop browsers).
        function isPortraitNow() {
          try {
            if (screen.orientation && typeof screen.orientation.type === 'string') {
              return screen.orientation.type.indexOf('portrait') === 0;
            }
          } catch (e) {}
          if (typeof window.orientation === 'number') {
            return window.orientation === 0 || window.orientation === 180;
          }
          return window.innerHeight > window.innerWidth;
        }
        // R3639 — a hard, session-persistent local override. Once set, check()
        // ALWAYS hides the overlay regardless of orientation / app portrait state.
        function check() {
          var hide = dismissed || !isPortraitNow() || window.__mgPortraitOK === true || !appSpoke;/* R3847 - see the latch above */
          el.style.display = hide ? 'none' : 'flex';
        }
        var btn = document.getElementById('rotate-dismiss');
        // R3639 — "Continue anyway" was firing on `click` only. Inside the itch.io
        // cross-origin iframe on mobile (fullscreen + `touch-action:none` ancestors),
        // the synthetic click after a tap is unreliable, so the button appeared dead
        // ("pressing continue anyway does nothing"). Bind the dismiss to touchend +
        // pointerup + click and de-dupe — it fires on the FIRST touch release, and the
        // action is idempotent so a later duplicate is harmless. preventDefault on the
        // touch/pointer path stops the ghost click from re-toggling anything.
        function doDismiss(e) {
          if (e) { try { e.preventDefault(); e.stopPropagation(); } catch (_) {} }
          if (dismissed) return;
          dismissed = true;
          try { sessionStorage.setItem('mgp_dismissRotate', '1'); } catch (e2) {}
          el.style.display = 'none';
        }
        if (btn) {
          btn.addEventListener('click', doDismiss);
          btn.addEventListener('touchend', doDismiss, { passive: false });
          btn.addEventListener('pointerup', doDismiss);
        }
        check();
        window.addEventListener('resize', check);
        // Re-check when the app toggles Portrait Play so the overlay clears instantly.
        // R3847 - this event is also what OPENS the latch: it is dispatched from the app's own
        // render (minigolf.jsx ~7091) the first time it publishes __mgPortraitOK, so it is
        // exactly the moment "the app has an opinion" becomes true.
        window.addEventListener('mgp-portrait-change', function () { appSpoke = true; check(); });
        if (screen.orientation) screen.orientation.addEventListener('change', check);
        // R2827 — also re-check on orientationchange, plus a deferred pass: some Android
        // browsers fire the event before the (fallback) dimensions settle.
        window.addEventListener('orientationchange', function(){ check(); setTimeout(check, 300); });
      })();
