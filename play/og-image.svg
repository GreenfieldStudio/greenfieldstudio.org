<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#4ECDC4"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#2a9d8f"/>
    </linearGradient>
  </defs>

  <!-- Background — flat site bg color (#0B1430) for brand consistency -->
  <rect width="1200" height="630" fill="#0B1430"/>

  <!-- Decorative stars -->
  <circle cx="100" cy="80" r="2" fill="#fff" opacity="0.4"/>
  <circle cx="300" cy="50" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="500" cy="100" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="700" cy="60" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="900" cy="90" r="2" fill="#fff" opacity="0.4"/>
  <circle cx="1100" cy="70" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="200" cy="140" r="1" fill="#fff" opacity="0.2"/>
  <circle cx="1050" cy="130" r="1" fill="#fff" opacity="0.2"/>

  <!-- Mini course preview -->
  <!-- Fairway -->
  <rect x="150" y="300" width="900" height="180" rx="20" fill="url(#grass)" opacity="0.3"/>
  <rect x="170" y="310" width="860" height="160" rx="14" fill="url(#grass)" opacity="0.5"/>

  <!-- Course outline -->
  <rect x="170" y="310" width="860" height="160" rx="14" fill="none" stroke="#4ECDC4" stroke-width="2" opacity="0.6"/>

  <!-- Obstacles - water hazard -->
  <ellipse cx="500" cy="390" rx="60" ry="30" fill="#1a6b8a" opacity="0.7"/>
  <ellipse cx="500" cy="388" rx="55" ry="26" fill="#2a8baa" opacity="0.5"/>

  <!-- Obstacles - sand trap -->
  <ellipse cx="720" cy="400" rx="45" ry="22" fill="#d4a843" opacity="0.5"/>

  <!-- Obstacles - bumpers -->
  <circle cx="380" cy="360" r="12" fill="#e74c3c" opacity="0.6"/>
  <circle cx="620" cy="350" r="10" fill="#e74c3c" opacity="0.6"/>

  <!-- Hole with flag -->
  <circle cx="950" cy="390" r="10" fill="#1a1a2e"/>
  <line x1="950" y1="390" x2="950" y2="340" stroke="#fff" stroke-width="2"/>
  <polygon points="950,340 985,352 950,364" fill="#e74c3c"/>

  <!-- Ball -->
  <circle cx="230" cy="390" r="8" fill="#fff"/>
  <circle cx="228" cy="388" r="3" fill="#fff" opacity="0.5"/>

  <!-- Dotted trajectory line -->
  <line x1="246" y1="388" x2="340" y2="365" stroke="#FFD93D" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Golf flag emoji area / Title -->
  <text x="600" y="190" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="80" font-weight="800" fill="url(#title)">MiniGolf Pro</text>

  <!-- Logo mark -->
  <g transform="translate(575, 70)">
    <path d="M -20 35 Q -5 -10 38 10" fill="none" stroke="url(#title)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="22" cy="15" r="20" fill="#fff"/>
    <circle cx="17" cy="12" r="2.5" fill="rgba(0,0,0,0.07)"/>
    <circle cx="28" cy="10" r="2.5" fill="rgba(0,0,0,0.07)"/>
    <circle cx="23" cy="23" r="2.5" fill="rgba(0,0,0,0.07)"/>
    <circle cx="15" cy="7" r="4" fill="rgba(255,255,255,0.5)"/>
  </g>

  <!-- Feature badges -->
  <g transform="translate(600, 550)">
    <!-- Badge background -->
    <rect x="-320" y="-22" width="640" height="44" rx="22" fill="rgba(255,255,255,0.08)"/>
    <text text-anchor="middle" y="8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="20" fill="#e0e8f0" letter-spacing="0.1em" opacity="0.8">80 Holes &#183; Multiplayer &#183; Level Editor &#183; Daily Challenges</text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="240" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="24" fill="#e0e8f0" opacity="0.6">Free to play in your browser</text>
</svg>
