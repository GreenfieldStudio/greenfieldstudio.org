<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
  <defs>
    <!-- Twilight backdrop — slightly warmer at the sun, deepens toward the corners. -->
    <radialGradient id="sky" cx="0.5" cy="0.36" r="0.85">
      <stop offset="0%"   stop-color="#1f3358"/>
      <stop offset="55%"  stop-color="#0f1d36"/>
      <stop offset="100%" stop-color="#070f22"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.42" cy="0.38" r="0.62">
      <stop offset="0%"   stop-color="#FFE873"/>
      <stop offset="100%" stop-color="#FFD93D"/>
    </radialGradient>
    <radialGradient id="halo" cx="50" cy="36" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFE873" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#FFD93D" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFD93D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Full-bleed twilight sky -->
  <rect width="100" height="100" fill="url(#sky)"/>
  <!-- Sun halo (slightly larger than the standalone mark — gives the avatar more glow at 40px) -->
  <circle cx="50" cy="36" r="24" fill="url(#halo)"/>
  <!-- Sun disc -->
  <circle cx="50" cy="36" r="13" fill="url(#sun)"/>
  <!-- Back hill -->
  <path d="M 0 66 Q 25 38 100 60 L 100 100 L 0 100 Z" fill="#5BA85F"/>
  <path d="M 4 64.8 Q 25 36.8 96 59.2" fill="none" stroke="#A8DDB5" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Front hill -->
  <path d="M 0 92 Q 72 54 100 78 L 100 100 L 0 100 Z" fill="#2D7A3E"/>
  <path d="M 5 90.5 Q 72 52.5 95 77" fill="none" stroke="#5BA85F" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
</svg>
