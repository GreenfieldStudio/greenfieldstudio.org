<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Greenfield Ambience, live scenes</title>
<meta name="description" content="A calm live scene from Greenfield Ambience, drawn in your browser by our own code.">
<link rel="stylesheet" href="shared/ui.css">
<style>
  main { max-width: var(--max); margin: 0 auto; padding: var(--gutter); }
  h1 { margin: 0 0 6px; font-size: 1.6rem; font-weight: 500; }
  .wa-hub-intro { margin: 0 0 24px; color: var(--cream-2); }
  .wa-hub { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px; margin: 0; padding: 0; list-style: none; }
  .wa-hub-card { display: flex; flex-direction: column; border: 1px solid var(--hair); border-radius: var(--radius); background: var(--field); }
  .wa-hub-card img, .wa-hub-ph { display: block; width: 100%; height: auto; aspect-ratio: 1280 / 508; background: var(--field-edge); }
  .wa-hub-ph { background: linear-gradient(180deg, #123a4a 0%, #0b2433 55%, #07161f 100%); }
  .wa-hub-ph-snow { background: linear-gradient(180deg, #1b2230 0%, #121823 55%, #2a2f38 100%); }
  .wa-hub-ph-candle { background: radial-gradient(ellipse at 30% 70%, #5a3a1c 0%, #2a1c12 35%, #120d0a 75%); }
  .wa-hub-body { padding: 14px 18px 18px; }
  .wa-hub-card h2 { margin: 0 0 6px; font-size: 1.15rem; font-weight: 500; }
  .wa-hub-card h2 a { display: inline-flex; align-items: center; min-height: 44px; color: var(--cream); text-decoration: none; }
  .wa-hub-card h2 a::after { content: ''; position: absolute; inset: 0; }
  .wa-hub-card { position: relative; }
  .wa-hub-card:hover, .wa-hub-card:focus-within { border-color: var(--hair-2); }
  .wa-hub-card h2 a:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .wa-hub-card p { margin: 0; color: var(--cream-2); font-size: 0.95rem; }
  .wa-hub-foot { margin: 28px 0 0; color: var(--cream-3); font-size: 0.85rem; }
  .wa-hub-foot a { color: var(--cream-2); }
</style>
</head>
<body>
<main>
<h1>Live scenes</h1>
<p class="wa-hub-intro">Pick a scene. Sound starts only when you turn it on.</p>
<ul class="wa-hub">
  <li class="wa-hub-card" data-scene="rain-window">
    <img src="rain-window/poster.webp" alt="" width="1280" height="508" loading="lazy" decoding="async">
    <div class="wa-hub-body">
      <h2><a href="rain-window/">Rain on the Cabin Window</a></h2>
      <p>Rain on a dark cabin window at night, drawn live in your browser by our own code.</p>
    </div>
  </li>
</ul>
<p class="wa-hub-foot">The full films are on the <a class="wa-link" href="https://www.youtube.com/@Greenfield.Ambience">Greenfield Ambience channel</a>.</p>
</main>
</body>
</html>
