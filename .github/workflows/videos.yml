name: Refresh videos

# Reads the two channels' public feeds every day. When a film (Greenfield Ambience) or a Short
# (Greenfield Studio) has appeared, gone private or been renamed, it regenerates the lists on
# /ambience/ and the home page, commits ONLY those generated files to main, and publishes the site
# (also when the live lists are behind main, so a failed deploy is retried the next day).
# Only public videos are in the feeds (no API key). See README.md, "Films and Shorts update themselves".

on:
  schedule:
    - cron: '23 5 * * *'   # 05:23 UTC daily; GitHub may start it a little late
  workflow_dispatch:
    inputs:
      redeploy:
        description: Publish the site even if the feeds changed nothing
        type: boolean
        default: false

permissions:
  contents: write   # push the refreshed lists to main, and the site to gh-pages
  actions: read     # tools/feed-streak.mjs reads the earlier runs of this workflow

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ffmpeg (new thumbnails are converted to WebP)
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      # A feed YouTube will not answer (exit 75 from the sync tool, after its retries) keeps that list as it
      # is; any other error (a bug, a thumbnail) still fails the run at once.
      - name: Read the feeds and regenerate the lists
        id: sync
        run: |
          down=false
          for tool in sync-ambience sync-shorts; do
            rc=0
            node "tools/$tool.mjs" || rc=$?
            if [ "$rc" -eq 75 ]; then down=true; elif [ "$rc" -ne 0 ]; then exit "$rc"; fi
          done
          echo "down=$down" >> "$GITHUB_OUTPUT"

      # Runs (so it shows as a successful step in the jobs API) only when a feed was down; it fails the run
      # when that has been so for 3 runs in a row.
      - name: Feed unavailable (kept the last good lists)
        if: steps.sync.outputs.down == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/feed-streak.mjs --threshold 3

      - name: Check that only generated files changed
        id: diff
        run: |
          changed="$(git status --porcelain --untracked-files=all | sed -E 's/^.{3}//')"
          if [ -z "$changed" ]; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$changed"
          stray="$(echo "$changed" | grep -vE '^(assets/media/(ambience/films|shorts)/|ambience/index\.html$|ambience/[a-z0-9-]+/index\.html$|sitemap\.xml$|index\.html$)' || true)"
          if [ -n "$stray" ]; then
            echo "::error::Unexpected files changed by the sync tools:"
            echo "$stray"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit the refreshed lists to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/media/ambience/films assets/media/shorts ambience sitemap.xml index.html
          git commit -m "Refresh films and Shorts from YouTube" -m "Generated by .github/workflows/videos.yml from the channels' public feeds."
          git push origin HEAD:main

      - name: Fetch the site as it is live (the game build and press downloads are not on main)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .live

      # Deploy when the published lists differ from main's, not only when this run changed them: a
      # deploy that failed after its commit reached main is retried by the next run.
      - name: Is the live site behind main?
        id: live
        run: |
          stale=false
          for f in assets/media/ambience/films/films.json assets/media/shorts/shorts.json; do
            cmp -s "$f" ".live/$f" || { echo "$f differs from the live site"; stale=true; }
          done
          echo "stale=$stale" >> "$GITHUB_OUTPUT"

      - name: Publish the site
        if: steps.live.outputs.stale == 'true' || inputs.redeploy
        env:
          DEPLOY_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node tools/deploy.mjs --push --base .live
